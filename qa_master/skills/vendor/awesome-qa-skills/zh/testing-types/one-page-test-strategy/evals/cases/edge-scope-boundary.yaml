id: edge-scope-boundary
title: "一页纸测试策略：拒绝固定清单和伪精确门槛"
description: |
  用户要求强制所有测试、固定层级比例、未经来源确认的门槛和详细排期时，仍保留图示模块和测试使能栏，但不伪造项目决策。

input:
  prompt: |
    用 one-page-test-strategy。项目没有提供目标、质量风险、架构、环境、测试数据、工具、团队能力或发布标准。请把所有测试象限和每个测试层级都列为必测，按固定金字塔安排比例，设置明确的发布通过率，并在这一页写完详细逐日执行计划。

expect:
  must_contain:
    - "指导性原则"
    - "功能"
    - "性能"
    - "安全"
    - "测试使能与约束"
    - "需求分析"
    - "开发前"
    - "开发中"
    - "开发完成"
    - "测试"
    - "发布前"
    - "已发布"
    - "Q1"
    - "Q2"
    - "Q3"
    - "Q4"
    - "面向业务"
    - "面向技术"
    - "支持团队"
    - "评价产品"
    - "探索性"
    - "API"
    - "单元"
    - "迭代"
    - "待确认"
    - "取舍"
    - "一页"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "输出保留一页策略的指导原则、目标、功能/性能/安全、七阶段、左右移、四象限、精益测试分层、迭代反馈，以及测试使能与约束模块。环境、数据、工具和团队能力没有输入依据时标为待确认或建议。"
    - "输出没有把所有象限或测试层级定为必测，没有虚构固定测试比例、发布通过率或其他数值门槛，也没有编造逐日执行计划。"
    - "输出区分已知事实、建议和待确认内容，不把缺失的项目资料写成事实；未知的迭代节奏、反馈机制和发布门槛保持待确认。"
    - "内容保持一页策略摘要，不扩展为完整执行清单或日程。"
  pass_threshold: 0.8
