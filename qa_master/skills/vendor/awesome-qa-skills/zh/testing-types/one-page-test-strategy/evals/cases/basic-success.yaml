id: basic-success
title: "一页纸测试策略：风险驱动的发布摘要"
description: |
  项目上下文明确时，输出图示中要求的一页原则、范围、七阶段、象限、分层和迭代反馈模块。

input:
  prompt: |
    使用 one-page-test-strategy。项目：电商订单平台两周后发布。业务目标：减少支付失败导致的未履约订单。核心链路：下单→支付→发货。已知风险：支付回调超时或重复；CI 和预发可用，QA 2 人、工程师 4 人；生产日志可观测，但不能直接修改线上数据。给团队产出一页可讨论的策略。

expect:
  must_contain:
    - "指导性原则"
    - "功能"
    - "性能"
    - "安全"
    - "测试使能与约束"
    - "需求分析"
    - "开发前"
    - "开发中"
    - "开发完成"
    - "测试"
    - "发布前"
    - "已发布"
    - "Q1"
    - "Q2"
    - "Q3"
    - "Q4"
    - "面向业务"
    - "面向技术"
    - "支持团队"
    - "评价产品"
    - "探索性"
    - "API"
    - "单元"
    - "迭代"
    - "反馈"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "目标"
          - "质量"
          - "生产"
