id: edge-incomplete-input
title: "一页纸测试策略：信息不足时保留缺口"
description: |
  只有发布意图时仍保留所有图示模块，并明确假设、未知项与决策缺口。

input:
  prompt: |
    使用 one-page-test-strategy。产品团队只说“下个月要上线”，没有说明产品范围、业务目标、风险、架构、测试环境、团队配置、生产观测方式或发布门槛。请先给一页策略草稿，不要追问。

expect:
  must_contain:
    - "指导性原则"
    - "目标"
    - "功能"
    - "性能"
    - "安全"
    - "测试使能与约束"
    - "需求分析"
    - "开发前"
    - "开发中"
    - "开发完成"
    - "发布前"
    - "已发布"
    - "Q1"
    - "Q2"
    - "Q3"
    - "Q4"
    - "面向业务"
    - "面向技术"
    - "支持团队"
    - "评价产品"
    - "探索性"
    - "API"
    - "单元"
    - "迭代"
    - "待确认"
  must_not_contain:
    - "95%"
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "缺口"
          - "风险"
